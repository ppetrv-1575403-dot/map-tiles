name: Generate regions (Protomaps + GraphHopper)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # === JOB 0: Скачиваем planet.pmtiles ОДИН раз ===
  download-planet:
    runs-on: ubuntu-latest
    outputs:
      planet_date: ${{ steps.find.outputs.date }}
    steps:
      - name: Find latest planet build
        id: find
        run: |
          for i in $(seq 1 14); do
            DATE=$(date -d "$i days ago" +%Y%m%d)
            URL="https://build.protomaps.com/${DATE}.pmtiles"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "date=$DATE" >> $GITHUB_OUTPUT
              echo "url=$URL" >> $GITHUB_OUTPUT
              echo "Found: $URL"
              break
            fi
          done

      - name: Cache planet pmtiles
        id: cache-planet
        uses: actions/cache@v4
        with:
          path: planet.pmtiles
          key: planet-${{ steps.find.outputs.date }}

      - name: Download planet (if not cached)
        if: steps.cache-planet.outputs.cache-hit != 'true'
        run: |
          echo "=== Скачиваем planet.pmtiles ==="
          curl -L --progress-bar \
            -o planet.pmtiles \
            "https://build.protomaps.com/${{ steps.find.outputs.date }}.pmtiles"
          ls -lh planet.pmtiles

      - name: Upload planet artifact
        uses: actions/upload-artifact@v4
        with:
          name: planet-pmtiles
          path: planet.pmtiles
          retention-days: 1

  # === JOB 1: Карты из Protomaps (matrix) ===
  generate-maps:
    runs-on: ubuntu-latest
    needs: download-planet
    strategy:
      fail-fast: false
      matrix:
        region:
          - name: minsk_region
            bbox: "26.30,52.80,29.20,55.00"
          - name: gomel_region
            bbox: "27.50,51.20,32.80,53.10"
          - name: moscow_region
            bbox: "35.10,54.20,40.20,56.90"
          - name: leningrad_region
            bbox: "27.70,58.40,35.70,61.40"
          - name: spb
            bbox: "29.90,59.70,30.60,60.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # === Кэш tippecanoe ===
      - name: Cache tippecanoe build
        id: cache-tippecanoe
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/tippecanoe
            /usr/local/bin/tile-join
          key: tippecanoe-felt-v1

      # === Кэш pmtiles CLI ===
      - name: Cache pmtiles CLI
        id: cache-pmtiles
        uses: actions/cache@v4
        with:
          path: pmtiles
          key: pmtiles-cli-${{ runner.os }}-v1

      - name: Install tippecanoe (if not cached)
        if: steps.cache-tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev libbz2-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          sudo cp tippecanoe /usr/local/bin/
          sudo cp tile-join /usr/local/bin/
          sudo chmod +x /usr/local/bin/tippecanoe /usr/local/bin/tile-join

      - name: Download pmtiles CLI (if not cached)
        if: steps.cache-pmtiles.outputs.cache-hit != 'true'
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | grep "browser_download_url" | grep "Linux_x86_64.tar.gz" \
            | head -1 | sed 's/.*"browser_download_url": "\(.*\)".*/\1/')
          echo "Downloading: $ASSET_URL"
          curl -L -o pmtiles.tar.gz "$ASSET_URL"
          tar -xzf pmtiles.tar.gz
          chmod +x pmtiles

      - name: Download planet artifact
        uses: actions/download-artifact@v4
        with:
          name: planet-pmtiles
          path: .

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline MBTiles" --notes "mbtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract region and convert to mbtiles
        run: |
          TILEJOIN=/usr/local/bin/tile-join
          MAXZOOM=15
          
          echo "=== Extracting ${{ matrix.region.name }} (maxzoom=$MAXZOOM) ==="
          echo "Planet size: $(ls -lh planet.pmtiles | awk '{print $5}')"
          
          ./pmtiles extract planet.pmtiles "${{ matrix.region.name }}.pmtiles" \
            --bbox="${{ matrix.region.bbox }}" \
            --maxzoom="$MAXZOOM"
          
          ./pmtiles show "${{ matrix.region.name }}.pmtiles" | head -15
          
          $TILEJOIN -o "${{ matrix.region.name }}.mbtiles" \
            "${{ matrix.region.name }}.pmtiles"
          
          echo "=== MBTiles size ==="
          ls -lh "${{ matrix.region.name }}.mbtiles"
          
          gh release upload maps "${{ matrix.region.name }}.mbtiles" --clobber
          
          rm -f "${{ matrix.region.name }}.pmtiles" "${{ matrix.region.name }}.mbtiles"
        env:
          GH_TOKEN: ${{ github.token }}

  # === JOB 2: Графы GraphHopper ===
  generate-graphs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # === Кэш GraphHopper jar ===
      - name: Cache GraphHopper jar
        id: cache-gh
        uses: actions/cache@v4
        with:
          path: graphhopper-web.jar
          key: graphhopper-5.0-v1

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline MBTiles" --notes "mbtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download GraphHopper (if not cached)
        if: steps.cache-gh.outputs.cache-hit != 'true'
        run: |
          curl -L -o graphhopper-web.jar \
            "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/5.0/graphhopper-web-5.0.jar"
          ls -lh graphhopper-web.jar

      - name: Install osmium
        run: sudo apt-get install -y osmium-tool

      # === Кэш Belarus PBF ===
      - name: Cache Belarus PBF
        id: cache-belarus
        uses: actions/cache@v4
        with:
          path: belarus.osm.pbf
          key: belarus-pbf-${{ hashFiles('**/belarus-latest.osm.pbf') }}-v1
          restore-keys: |
            belarus-pbf-

      - name: Download Belarus PBF (if not cached)
        if: steps.cache-belarus.outputs.cache-hit != 'true'
        run: |
          curl -L --connect-timeout 30 --max-time 600 \
            --progress-bar \
            -o belarus.osm.pbf \
            "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
          ls -lh belarus.osm.pbf

      - name: Generate road graphs (car + foot optimized)
        run: |
          regions=(
            "gomel_region|27.50,51.20,32.80,53.10"
            "minsk_region|26.30,52.80,29.20,55.00"
          )
          
          for r in "${regions[@]}"; do
            IFS='|' read -r name bbox <<< "$r"
            echo "::group::Generating graph for $name"
            
            osmium extract belarus.osm.pbf -b "$bbox" -o "${name}.osm.pbf" --overwrite
            
            cat > "${name}_config.yml" <<EOF
          graphhopper:
            datareader.file: ${name}.osm.pbf
            graph.location: ${name}.gh
            import.osm.ignored_highways: []
            graph.encoded_values: surface,road_class,road_environment,max_speed
            profiles:
              - name: car
                vehicle: car
                weighting: fastest
                turn_costs: true
              - name: foot
                vehicle: foot
                weighting: shortest
                turn_costs: false
            prepare:
              min_network_size: 200
              ch:
                weightings: fastest|turn_costs=true,shortest
            routing:
              ch.disabling_allowed: true
              lm.disabling_allowed: true
            index:
              precise_elevation: false
          EOF
            
            java -Xmx4g -jar graphhopper-web.jar import "${name}_config.yml"
            
            zip -r "${name}_graph.zip" "${name}.gh"
            gh release upload maps "${name}_graph.zip" --clobber
            
            rm -rf "${name}.gh" "${name}_graph.zip" "${name}.osm.pbf" "${name}_config.yml"
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  # === JOB 3: Итог ===
  summary:
    runs-on: ubuntu-latest
    needs: [download-planet, generate-maps, generate-graphs]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "=== Сводка ==="
          echo "Planet: ${{ needs.download-planet.outputs.planet_date }}"
          echo "Карты: maxzoom=15, gzip"
          echo "Графы: car (fastest) + foot (shortest)"
