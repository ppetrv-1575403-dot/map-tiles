name: Extract MBTiles regions and road graphs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev libbz2-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          cd ..
          # Копируем бинарники (обрати внимание: tile-join, а не tilejoin)
          sudo cp tippecanoe/tippecanoe /usr/local/bin/
          sudo cp tippecanoe/tile-join /usr/local/bin/
          sudo chmod +x /usr/local/bin/tippecanoe /usr/local/bin/tile-join
          /usr/local/bin/tile-join --version || /usr/local/bin/tile-join --help | head -3

      - name: Download pmtiles CLI
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | grep "browser_download_url" | grep "Linux_x86_64.tar.gz" \
            | head -1 | sed 's/.*"browser_download_url": "\(.*\)".*/\1/')
          curl -L -o pmtiles.tar.gz "$ASSET_URL"
          tar -xzf pmtiles.tar.gz
          chmod +x pmtiles

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline MBTiles" --notes "mbtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find planet build
        run: |
          PLANET=""
          for i in $(seq 1 14); do
            DATE=$(date -d "$i days ago" +%Y%m%d)
            URL="https://build.protomaps.com/${DATE}.pmtiles"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL")
            if [ "$STATUS" = "200" ]; then
              PLANET="$URL"
              echo "Found planet build: $PLANET"
              break
            fi
          done
          if [ -z "$PLANET" ]; then
            echo "No planet build found"
            exit 1
          fi
          echo "PLANET=$PLANET" >> $GITHUB_ENV

      - name: Extract and convert regions
        run: |
          TILEJOIN=/usr/local/bin/tile-join
          #regions=(
            "minsk_region|26.30,52.80,29.20,55.00|13"
            "gomel_region|27.50,51.20,32.80,53.10|18"
            "moscow_region|35.10,54.20,40.20,56.90|13"
            "leningrad_region|27.70,58.40,35.70,61.40|12"
            "spb|29.90,59.70,30.60,60.10|13"
          )

          
          for r in "${regions[@]}"; do
            IFS='|' read -r name bbox zoom <<< "$r"
            echo "::group::Extracting $name"
            
            ./pmtiles extract "$PLANET" "${name}.pmtiles" --bbox="$bbox" --maxzoom="$zoom" --download-threads=8
            
            $TILEJOIN -o "${name}.mbtiles" "${name}.pmtiles" --no-tile-compression
            
            gh release upload maps "${name}.mbtiles" --clobber
            
            rm -f "${name}.pmtiles" "${name}.mbtiles"
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install GraphHopper 7.0
        run: |
          # Скачиваем основной файл версии 5.0
          curl -L -o graphhopper-web.jar "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/5.0/graphhopper-web-5.0.jar"        
          
          # Проверяем, что файл скачался
          echo "=== Проверка файлов ==="
          ls -la *.jar || echo "No jar files found"
          ls -la graphhopper-web.jar || echo "graphhopper-web.jar not found"
          
          FILE_SIZE=$(stat -c%s graphhopper-web.jar 2>/dev/null || echo "0")
          echo "File size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "File too small, trying alternative URL..."
            curl -L -o graphhopper-web.jar \
              "https://github.com/graphhopper/graphhopper/releases/download/5.0/graphhopper-web-5.0.jar"
          fi
          
          java -version

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          which osmium || echo "osmium not found in PATH"
          osmium --version || echo "osmium version check failed"
          ls -la /usr/bin/ | grep -i osmium || echo "not in /usr/bin"

      - name: Generate road graphs
        run: |
          # Проверяем наличие файла
          if [ ! -f graphhopper-web.jar ]; then
            echo "ERROR: graphhopper-web.jar not found!"
            ls -la
            exit 1
          fi
          
          # Скачиваем данные Беларуси из Geofabrik с таймаутом
          echo "=== Начинаем скачивание данных Беларуси ==="
          curl -L --connect-timeout 30 --max-time 600 \
            --progress-bar \
            -o belarus.osm.pbf \
            "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
          
          FILE_SIZE=$(stat -c%s belarus.osm.pbf 2>/dev/null || echo "0")
          echo "=== Скачано: $FILE_SIZE байт ==="
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: Файл слишком мал или не скачался"
            exit 1
          fi
          
          regions=(
            "gomel_region|27.50,51.20,32.80,53.10"
            "minsk_region|26.30,52.80,29.20,55.00"
          )
          
          for r in "${regions[@]}"; do
            IFS='|' read -r name bbox <<< "$r"
            echo "::group::Generating graph for $name"
            
            # Вырезаем регион
            osmium extract belarus.osm.pbf -b "$bbox" -o "${name}.osm.pbf" --overwrite
            
            # Создаём конфигурационный файл для GraphHopper
            printf 'graphhopper:\n' > "${name}_config.yml"
            printf '  datareader.file: %s.osm.pbf\n' "$name" >> "${name}_config.yml"
            printf '  graph.location: %s.gh\n' "$name" >> "${name}_config.yml"
            printf '  import.osm.ignored_highways: []\n' >> "${name}_config.yml"
            printf '  graph.vehicles: car,foot\n' >> "${name}_config.yml"
            printf '  profiles:\n' >> "${name}_config.yml"
            printf '    - name: car\n' >> "${name}_config.yml"
            printf '      vehicle: car\n' >> "${name}_config.yml"
            printf '      weighting: fastest\n' >> "${name}_config.yml"
            printf '    - name: foot\n' >> "${name}_config.yml"
            printf '      vehicle: foot\n' >> "${name}_config.yml"
            printf '      weighting: fastest\n' >> "${name}_config.yml"       
            
            # Показываем конфиг для диагностики
            echo "=== Generated config ==="
            cat "${name}_config.yml"
            echo "========================"
            
            # Генерируем граф дорог
            java -jar graphhopper-web.jar import "${name}_config.yml"
            
            # Упаковываем в zip
            zip -r "${name}_graph.zip" "${name}.gh"
            
            # Загружаем в релиз
            gh release upload maps "${name}_graph.zip" --clobber
            
            rm -rf "${name}.gh" "${name}_graph.zip" "${name}.osm.pbf" "${name}_config.yml"
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ github.token }}
