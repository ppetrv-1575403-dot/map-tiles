name: Extract MBTiles regions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev libbz2-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          cd ..
          # Копируем бинарники (обрати внимание: tile-join, а не tilejoin)
          sudo cp tippecanoe/tippecanoe /usr/local/bin/
          sudo cp tippecanoe/tile-join /usr/local/bin/
          sudo chmod +x /usr/local/bin/tippecanoe /usr/local/bin/tile-join
          # Проверяем
          /usr/local/bin/tile-join --version || /usr/local/bin/tile-join --help | head -3
      
      - name: Download pmtiles CLI
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | grep "browser_download_url" | grep "Linux_x86_64.tar.gz" \
            | head -1 | sed 's/.*"browser_download_url": "\(.*\)".*/\1/')
          curl -L -o pmtiles.tar.gz "$ASSET_URL"
          tar -xzf pmtiles.tar.gz
          chmod +x pmtiles

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline MBTiles" --notes "mbtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find planet build
        run: |
          PLANET=""
          for i in $(seq 1 14); do
            DATE=$(date -d "$i days ago" +%Y%m%d)
            URL="https://build.protomaps.com/${DATE}.pmtiles"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL")
            if [ "$STATUS" = "200" ]; then
              PLANET="$URL"
              echo "Found planet build: $PLANET"
              break
            fi
          done
          if [ -z "$PLANET" ]; then
            echo "No planet build found"
            exit 1
          fi
          echo "PLANET=$PLANET" >> $GITHUB_ENV
      
      - name: Extract and convert regions
        run: |
          TILEJOIN=/usr/local/bin/tile-join
          regions=(
            "minsk_region|26.30,52.80,29.20,55.00|17"
            "gomel_region|27.50,51.20,32.80,53.10|17"
          )
          for r in "${regions[@]}"; do
            IFS='|' read -r name bbox zoom <<< "$r"
            echo "::group::Extracting $name"
            
            ./pmtiles extract "$PLANET" "${name}.pmtiles" --bbox="$bbox" --maxzoom="$zoom" --download-threads=8
            
            $TILEJOIN -o "${name}.mbtiles" "${name}.pmtiles" --no-tile-compression
            
            gh release upload maps "${name}.mbtiles" --clobber
            
            rm -f "${name}.pmtiles" "${name}.mbtiles"
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install GraphHopper
        run: |
          # Скачиваем GraphHopper CLI
          curl -L -o graphhopper-web.jar "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/8.0/graphhopper-web-8.0.jar"
          curl -L -o graphhopper-reader.jar "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-core/8.0/graphhopper-core-8.0.jar"
          # Проверяем
          java -version

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Generate road graphs
        run: |
          # Скачиваем данные Беларуси из Geofabrik
          curl -L -o belarus.osm.pbf "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
          
          # Вырезаем регионы по bounding box и генерируем графы
          regions=(
            "gomel_region|27.50,51.20,32.80,53.10"
            "minsk_region|26.30,52.80,29.20,55.00"
          )
          
          for r in "${regions[@]}"; do
            IFS='|' read -r name bbox <<< "$r"
            echo "::group::Generating graph for $name"
            
            # Вырезаем регион
            osmium extract belarus.osm.pbf -b "$bbox" -o "${name}.osm.pbf" --overwrite
            
            # Генерируем граф дорог
            java -cp graphhopper-web.jar:graphhopper-reader.jar \
              com.graphhopper.application.GraphHopperApplication import \
              --input "${name}.osm.pbf" \
              --graph.location "${name}.gh" \
              --vehicles car,foot
            
            # Упаковываем в zip
            zip -r "${name}_graph.zip" "${name}.gh"
            
            # Загружаем в релиз
            gh release upload maps "${name}_graph.zip" --clobber
            
            rm -rf "${name}.gh" "${name}_graph.zip" "${name}.osm.pbf"
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ github.token }}
