name: Generate regions with Planetiler (OpenMapTiles)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # === JOB 0A: Читаем список регионов для карт ===
  prepare-maps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read regions.json and set matrix
        id: set-matrix
        run: |
          MATRIX_JSON=$(cat regions.json | jq -c .)
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # === JOB 0B: Читаем список регионов для графов ===
  prepare-graphs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read graphs.json and set matrix
        id: set-matrix
        run: |
          MATRIX_JSON=$(cat graphs.json | jq -c .)
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # === JOB 1: Генерация тайлов через Planetiler ===
  generate-maps:
    needs: prepare-maps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.prepare-maps.outputs.matrix).regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline Maps (MBTiles)" --notes "mbtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Planetiler
        run: |
          echo "=== Скачиваем Planetiler ==="
          
          MAX_ATTEMPTS=3
          ATTEMPT=0
          SUCCESS=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$SUCCESS" != "true" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Attempt $ATTEMPT of $MAX_ATTEMPTS ==="
            
            rm -f planetiler.jar
            
            HTTP_CODE=$(curl -L \
              --connect-timeout 60 \
              --max-time 600 \
              --retry 3 \
              --retry-delay 10 \
              -o planetiler.jar \
              -w "%{http_code}" \
              "https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar")
            
            echo "HTTP status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ] && [ "$HTTP_CODE" != "301" ]; then
              echo "❌ HTTP $HTTP_CODE, retrying..."
              rm -f planetiler.jar
              sleep 15
              continue
            fi
            
            if [ ! -f planetiler.jar ]; then
              echo "❌ File not created"
              sleep 15
              continue
            fi
            
            FILE_SIZE=$(stat -c%s planetiler.jar 2>/dev/null || echo "0")
            echo "Размер planetiler.jar: $FILE_SIZE байт"
            
            if [ "$FILE_SIZE" -lt 10485760 ]; then
              echo "❌ Файл слишком мал (< 10 МБ)"
              head -c 500 planetiler.jar
              rm -f planetiler.jar
              sleep 15
              continue
            fi
            
            if ! unzip -t planetiler.jar > /dev/null 2>&1; then
              echo "❌ Файл не является валидным JAR"
              rm -f planetiler.jar
              sleep 15
              continue
            fi
            
            SUCCESS=true
            echo "✅ Planetiler скачан: $FILE_SIZE байт"
          done
          
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Failed to download Planetiler"
            exit 1
          fi
          
          ls -lh planetiler.jar

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      # === Скачиваем все 4 вспомогательных файла для OpenMapTiles ===
      - name: Download auxiliary data files
        run: |
          echo "=== Скачиваем вспомогательные файлы для OpenMapTiles ==="
          mkdir -p data/sources
          
          download_with_retry() {
            local url="$1"
            local output="$2"
            local max_attempts=3
            local attempt=0
            local success=false
            
            while [ $attempt -lt $max_attempts ] && [ "$success" != "true" ]; do
              attempt=$((attempt + 1))
              echo "=== Attempt $attempt/$max_attempts: $url ==="
              
              HTTP_CODE=$(curl -L \
                --connect-timeout 60 \
                --max-time 600 \
                --retry 3 \
                --retry-delay 30 \
                -o "$output" \
                -w "%{http_code}" \
                "$url")
              
              echo "HTTP status: $HTTP_CODE"
              
              if [ "$HTTP_CODE" = "200" ]; then
                FILE_SIZE=$(stat -c%s "$output" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -gt 1024 ]; then
                  echo "✅ Downloaded: $FILE_SIZE bytes"
                  success=true
                else
                  echo "❌ File too small"
                  rm -f "$output"
                  sleep 30
                fi
              else
                echo "❌ HTTP $HTTP_CODE"
                rm -f "$output"
                sleep 30
              fi
            done
            
            if [ "$success" != "true" ]; then
              echo "❌ Failed to download $url"
              exit 1
            fi
          }
          
          # Скачиваем все 4 нужных файла для OpenMapTiles
          download_with_retry \
            "https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip" \
            "data/sources/natural_earth_vector.sqlite.zip"
          
          download_with_retry \
            "https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip" \
            "data/sources/water-polygons-split-3857.zip"
          
          download_with_retry \
            "https://osmdata.openstreetmap.de/download/land-polygons-split-3857.zip" \
            "data/sources/land-polygons-split-3857.zip"
          
          # Линии центров озёр (для подписей)
          download_with_retry \
            "https://osmdata.openstreetmap.de/download/lake_centerline.shp.zip" \
            "data/sources/lake_centerline.shp.zip"
          
          echo "=== Все файлы скачаны ==="
          ls -lh data/sources/

      - name: Cache source OSM PBF
        id: cache-source
        uses: actions/cache@v4
        with:
          path: source.osm.pbf
          key: osm-pbf-${{ matrix.region.source_name }}-v3
          restore-keys: |
            osm-pbf-${{ matrix.region.source_name }}-

      - name: Validate cached PBF size
        id: validate-cache
        run: |
          if [ -f source.osm.pbf ]; then
            FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
            echo "Cached file size: $FILE_SIZE bytes"
            if [ "$FILE_SIZE" -lt 1048576 ]; then
              echo "❌ Cached file too small (< 1MB), deleting"
              rm -f source.osm.pbf
              echo "cache_valid=false" >> $GITHUB_OUTPUT
            else
              echo "✅ Cache is valid"
              echo "cache_valid=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "cache_valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Download source OSM PBF (with retry)
        if: steps.validate-cache.outputs.cache_valid != 'true'
        run: |
          echo "=== Скачиваем ${{ matrix.region.source_name }} ==="
          echo "URL: ${{ matrix.region.source_url }}"
          
          MAX_ATTEMPTS=3
          ATTEMPT=0
          SUCCESS=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$SUCCESS" != "true" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Attempt $ATTEMPT of $MAX_ATTEMPTS ==="
            
            rm -f source.osm.pbf
            
            HTTP_CODE=$(curl -L \
              --connect-timeout 60 \
              --max-time 3600 \
              --retry 3 \
              --retry-delay 30 \
              --retry-all-errors \
              --progress-bar \
              -o source.osm.pbf \
              -w "%{http_code}" \
              "${{ matrix.region.source_url }}")
            
            echo "HTTP status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ HTTP $HTTP_CODE, retrying..."
              rm -f source.osm.pbf
              sleep 30
              continue
            fi
            
            if [ ! -f source.osm.pbf ]; then
              echo "❌ File not created"
              sleep 30
              continue
            fi
            
            FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
            echo "Размер: $FILE_SIZE байт"
            
            if [ "$FILE_SIZE" -lt 1048576 ]; then
              echo "❌ File too small ($FILE_SIZE bytes < 1MB)"
              head -c 500 source.osm.pbf
              rm -f source.osm.pbf
              sleep 30
              continue
            fi
            
            SUCCESS=true
            echo "✅ Download successful: $FILE_SIZE bytes"
          done
          
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Failed to download after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Validate source PBF
        run: |
          echo "=== Диагностика PBF файла ==="
          ls -lh source.osm.pbf
          FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
          echo "Размер файла: $FILE_SIZE байт"
          
          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "❌ Файл слишком мал (< 1 МБ)"
            rm -f source.osm.pbf
            exit 1
          fi
          echo "✅ Размер файла нормальный"
          
          if osmium fileinfo source.osm.pbf; then
            echo "✅ Файл читается osmium"
          else
            echo "❌ osmium fileinfo failed"
            rm -f source.osm.pbf
            exit 1
          fi

      - name: Extract region bbox
        run: |
          echo "=== Вырезаем ${{ matrix.region.name }} ==="
          echo "BBox: ${{ matrix.region.bbox }}"
          
          osmium extract source.osm.pbf \
            -b "${{ matrix.region.bbox }}" \
            -o "${{ matrix.region.name }}.osm.pbf" \
            --overwrite
          
          ls -lh "${{ matrix.region.name }}.osm.pbf"
          
          EXTRACT_SIZE=$(stat -c%s "${{ matrix.region.name }}.osm.pbf" 2>/dev/null || echo "0")
          echo "Размер extract: $EXTRACT_SIZE байт"
          
          if [ "$EXTRACT_SIZE" -lt 1024 ]; then
            echo "❌ Extract пустой"
            exit 1
          fi
          echo "✅ Extract создан"

      # === Генерация mbtiles БЕЗ --download (все файлы уже в data/sources/) ===
      - name: Generate mbtiles with Planetiler
        run: |
          echo "=== Генерируем mbtiles (maxzoom=${{ matrix.region.maxzoom }}, storage=${{ matrix.region.storage }}) ==="
          
          java -Xmx6g -jar planetiler.jar \
            --osm-path="${{ matrix.region.name }}.osm.pbf" \
            --output="${{ matrix.region.name }}.mbtiles" \
            --bounds="${{ matrix.region.bbox }}" \
            --profile=openmaptiles \
            --maxzoom=${{ matrix.region.maxzoom }} \
            --force \
            --storage=${{ matrix.region.storage }} \
            --threads=2
          
          ls -lh "${{ matrix.region.name }}.mbtiles"
          
          if [ ! -s "${{ matrix.region.name }}.mbtiles" ]; then
            echo "ERROR: mbtiles не создан"
            exit 1
          fi
          
          if ! sqlite3 "${{ matrix.region.name }}.mbtiles" "SELECT COUNT(*) FROM sqlite_master LIMIT 1;" > /dev/null 2>&1; then
            echo "❌ MBTiles не валиден"
            exit 1
          fi
          echo "✅ MBTiles валиден"

      - name: Upload mbtiles to release
        run: |
          gh release upload maps "${{ matrix.region.name }}.mbtiles" --clobber
          echo "✅ Загружен: ${{ matrix.region.name }}.mbtiles"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cleanup
        run: |
          rm -f "${{ matrix.region.name }}.osm.pbf" \
                "${{ matrix.region.name }}.mbtiles" \
                source.osm.pbf

  # === JOB 2: Генерация графов GraphHopper ===
  generate-graphs:
    needs: prepare-graphs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        graph: ${{ fromJSON(needs.prepare-graphs.outputs.matrix).graphs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline Maps (MBTiles)" --notes "mbtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache GraphHopper jar
        id: cache-gh
        uses: actions/cache@v4
        with:
          path: graphhopper-web.jar
          key: graphhopper-5.0-v1

      - name: Download GraphHopper (if not cached)
        if: steps.cache-gh.outputs.cache-hit != 'true'
        run: |
          curl -L -o graphhopper-web.jar \
            "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/5.0/graphhopper-web-5.0.jar"
          ls -lh graphhopper-web.jar

      - name: Install osmium
        run: sudo apt-get install -y osmium-tool

      - name: Cache source OSM PBF for graph
        id: cache-source-graph
        uses: actions/cache@v4
        with:
          path: source.osm.pbf
          key: graph-pbf-${{ matrix.graph.source_name }}-v1
          restore-keys: |
            graph-pbf-${{ matrix.graph.source_name }}-

      - name: Validate cached PBF size (graph)
        id: validate-cache-graph
        run: |
          if [ -f source.osm.pbf ]; then
            FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
            echo "Cached file size: $FILE_SIZE bytes"
            if [ "$FILE_SIZE" -lt 1048576 ]; then
              echo "❌ Cached file too small (< 1MB), deleting"
              rm -f source.osm.pbf
              echo "cache_valid=false" >> $GITHUB_OUTPUT
            else
              echo "✅ Cache is valid"
              echo "cache_valid=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "cache_valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Download source OSM PBF for graph (with retry)
        if: steps.validate-cache-graph.outputs.cache_valid != 'true'
        run: |
          echo "=== Скачиваем ${{ matrix.graph.source_name }} для графа ==="
          echo "URL: ${{ matrix.graph.source_url }}"
          
          MAX_ATTEMPTS=3
          ATTEMPT=0
          SUCCESS=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$SUCCESS" != "true" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Attempt $ATTEMPT of $MAX_ATTEMPTS ==="
            
            rm -f source.osm.pbf
            
            HTTP_CODE=$(curl -L \
              --connect-timeout 60 \
              --max-time 1800 \
              --retry 3 \
              --retry-delay 30 \
              --retry-all-errors \
              --progress-bar \
              -o source.osm.pbf \
              -w "%{http_code}" \
              "${{ matrix.graph.source_url }}")
            
            echo "HTTP status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ HTTP $HTTP_CODE, retrying..."
              rm -f source.osm.pbf
              sleep 30
              continue
            fi
            
            if [ ! -f source.osm.pbf ]; then
              echo "❌ File not created"
              sleep 30
              continue
            fi
            
            FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
            echo "Размер: $FILE_SIZE байт"
            
            if [ "$FILE_SIZE" -lt 1048576 ]; then
              echo "❌ File too small (вероятно HTML страница)"
              echo "=== Первые 500 байт ==="
              head -c 500 source.osm.pbf
              rm -f source.osm.pbf
              sleep 30
              continue
            fi
            
            SUCCESS=true
            echo "✅ Download successful: $FILE_SIZE bytes"
          done
          
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Failed to download after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Validate source PBF (graph)
        run: |
          echo "=== Диагностика PBF файла ==="
          ls -lh source.osm.pbf
          FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
          echo "Размер файла: $FILE_SIZE байт"
          
          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "❌ Файл слишком мал (< 1 МБ)"
            rm -f source.osm.pbf
            exit 1
          fi
          echo "✅ Размер файла нормальный"
          
          if osmium fileinfo source.osm.pbf; then
            echo "✅ Файл читается osmium"
          else
            echo "❌ osmium fileinfo failed"
            rm -f source.osm.pbf
            exit 1
          fi

      - name: Generate road graph for ${{ matrix.graph.name }}
        run: |
          echo "::group::Generating graph for ${{ matrix.graph.name }}"
          echo "BBox: ${{ matrix.graph.bbox }}"
          
          osmium extract source.osm.pbf \
            -b "${{ matrix.graph.bbox }}" \
            -o "${{ matrix.graph.name }}.osm.pbf" \
            --overwrite
          
          EXTRACT_SIZE=$(stat -c%s "${{ matrix.graph.name }}.osm.pbf" 2>/dev/null || echo "0")
          if [ "$EXTRACT_SIZE" -lt 1024 ]; then
            echo "❌ Extract пустой"
            exit 1
          fi
          
          cat > "${{ matrix.graph.name }}_config.yml" <<EOF
          graphhopper:
            datareader.file: ${{ matrix.graph.name }}.osm.pbf
            graph.location: ${{ matrix.graph.name }}.gh
            graph.encoded_values: surface,road_class,road_environment,max_speed
            profiles:
              - name: car
                vehicle: car
                weighting: fastest
                turn_costs: true
              - name: foot
                vehicle: foot
                weighting: shortest
                turn_costs: false
            prepare:
              min_network_size: 200
              ch:
                - profile: car
                - profile: foot
            routing:
              ch.disabling_allowed: true
              lm.disabling_allowed: true
            index:
              precise_elevation: false
          EOF
          
          echo "=== Generated config ==="
          cat "${{ matrix.graph.name }}_config.yml"
          
          java -Xmx4g -jar graphhopper-web.jar import "${{ matrix.graph.name }}_config.yml"
          
          if [ ! -d "${{ matrix.graph.name }}.gh" ]; then
            echo "❌ Graph directory not created!"
            exit 1
          fi
          
          zip -r "${{ matrix.graph.name }}_graph.zip" "${{ matrix.graph.name }}.gh"
          ls -lh "${{ matrix.graph.name }}_graph.zip"
          
          gh release upload maps "${{ matrix.graph.name }}_graph.zip" --clobber
          echo "✅ Graph uploaded: ${{ matrix.graph.name }}_graph.zip"
          
          rm -rf "${{ matrix.graph.name }}.gh" \
                "${{ matrix.graph.name }}_graph.zip" \
                "${{ matrix.graph.name }}.osm.pbf" \
                "${{ matrix.graph.name }}_config.yml" \
                source.osm.pbf
          echo "::endgroup::"
        env:
          GH_TOKEN: ${{ github.token }}