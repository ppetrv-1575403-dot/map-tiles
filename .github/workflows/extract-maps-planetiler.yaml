name: Generate regions with Planetiler (OpenMapTiles)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # === JOB 1: Генерация тайлов через Planetiler (по регионам параллельно) ===
  generate-maps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region:
          - name: minsk_region
            bbox: "26.30,52.80,29.20,55.00"
            source_url: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
            source_name: "belarus"
            maxzoom: 15
          - name: gomel_region
            bbox: "27.50,51.20,32.80,53.10"
            source_url: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
            source_name: "belarus"
            maxzoom: 15
          - name: moscow_region
            bbox: "35.10,54.20,40.20,56.90"
            source_url: "https://download.geofabrik.de/europe/russia/central-fed-district-latest.osm.pbf"
            source_name: "russia-central"
            maxzoom: 15
          - name: leningrad_region
            bbox: "27.70,58.40,35.70,61.40"
            source_url: "https://download.geofabrik.de/europe/russia/northwestern-fed-district-latest.osm.pbf"
            source_name: "russia-nw"
            maxzoom: 15
          - name: spb
            bbox: "29.90,59.70,30.60,60.10"
            source_url: "https://download.geofabrik.de/europe/russia/northwestern-fed-district-latest.osm.pbf"
            source_name: "russia-nw"
            maxzoom: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline Maps (PMTiles)" --notes "pmtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Planetiler
        run: |
          echo "=== Скачиваем последнюю версию Planetiler ==="
          curl -L -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar"
          ls -lh planetiler.jar
          java -version
          java -jar planetiler.jar --version 2>&1 | head -5 || true

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      # === Кэш OSM PBF (версия v3 для сброса битых файлов) ===
      - name: Cache source OSM PBF
        id: cache-source
        uses: actions/cache@v4
        with:
          path: source.osm.pbf
          key: osm-pbf-${{ matrix.region.source_name }}-v3
          restore-keys: |
            osm-pbf-${{ matrix.region.source_name }}-

      - name: Validate cached PBF size
        id: validate-cache
        run: |
          if [ -f source.osm.pbf ]; then
            FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
            echo "Cached file size: $FILE_SIZE bytes"
            if [ "$FILE_SIZE" -lt 1048576 ]; then
              echo "❌ Cached file too small (< 1MB), deleting"
              rm -f source.osm.pbf
              echo "cache_valid=false" >> $GITHUB_OUTPUT
            else
              echo "✅ Cache is valid"
              echo "cache_valid=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "cache_valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Download source OSM PBF (with retry)
        if: steps.validate-cache.outputs.cache_valid != 'true'
        run: |
          echo "=== Скачиваем ${{ matrix.region.source_name }} ==="
          echo "URL: ${{ matrix.region.source_url }}"
          
          MAX_ATTEMPTS=3
          ATTEMPT=0
          SUCCESS=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$SUCCESS" != "true" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Attempt $ATTEMPT of $MAX_ATTEMPTS ==="
            
            rm -f source.osm.pbf
            
            HTTP_CODE=$(curl -L \
              --connect-timeout 60 \
              --max-time 3600 \
              --retry 3 \
              --retry-delay 30 \
              --retry-all-errors \
              --progress-bar \
              -o source.osm.pbf \
              -w "%{http_code}" \
              "${{ matrix.region.source_url }}")
            
            echo "HTTP status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ HTTP $HTTP_CODE, retrying..."
              rm -f source.osm.pbf
              sleep 30
              continue
            fi
            
            if [ ! -f source.osm.pbf ]; then
              echo "❌ File not created"
              sleep 30
              continue
            fi
            
            FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
            echo "Размер: $FILE_SIZE байт"
            
            if [ "$FILE_SIZE" -lt 1048576 ]; then
              echo "❌ File too small ($FILE_SIZE bytes < 1MB), probably HTML error page"
              echo "=== First 500 chars of file ==="
              head -c 500 source.osm.pbf
              rm -f source.osm.pbf
              sleep 30
              continue
            fi
            
            SUCCESS=true
            echo "✅ Download successful: $FILE_SIZE bytes"
          done
          
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Failed to download after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Validate source PBF
        run: |
          echo "=== Диагностика PBF файла ==="
          ls -lh source.osm.pbf
          FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
          echo "Размер файла: $FILE_SIZE байт"
          
          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "❌ Файл слишком мал (< 1 МБ)"
            rm -f source.osm.pbf
            exit 1
          fi
          echo "✅ Размер файла нормальный"
          
          echo "=== osmium fileinfo ==="
          if osmium fileinfo source.osm.pbf; then
            echo "✅ Файл читается osmium"
          else
            echo "❌ osmium fileinfo не смог прочитать файл"
            rm -f source.osm.pbf
            exit 1
          fi
          
          echo "=== Все проверки пройдены ==="

      - name: Extract region bbox
        run: |
          echo "=== Вырезаем ${{ matrix.region.name }} ==="
          echo "BBox: ${{ matrix.region.bbox }}"
          
          osmium extract source.osm.pbf \
            -b "${{ matrix.region.bbox }}" \
            -o "${{ matrix.region.name }}.osm.pbf" \
            --overwrite
          
          ls -lh "${{ matrix.region.name }}.osm.pbf"
          
          EXTRACT_SIZE=$(stat -c%s "${{ matrix.region.name }}.osm.pbf" 2>/dev/null || echo "0")
          echo "Размер extract: $EXTRACT_SIZE байт"
          
          if [ "$EXTRACT_SIZE" -lt 1024 ]; then
            echo "❌ Extract слишком мал или пустой"
            exit 1
          fi
          
          echo "✅ Extract создан успешно"

      - name: Generate mbtiles with Planetiler (OpenMapTiles profile)
        run: |
          echo "=== Генерируем mbtiles (OpenMapTiles, maxzoom=${{ matrix.region.maxzoom }}) ==="
          
          java -Xmx6g -jar planetiler.jar \
            --osm-path="${{ matrix.region.name }}.osm.pbf" \
            --output="${{ matrix.region.name }}.mbtiles" \
            --output-fmt=mbtiles \
            --bounds="${{ matrix.region.bbox }}" \
            --profile=openmaptiles \
            --maxzoom=${{ matrix.region.maxzoom }} \
            --force \
            --download \
            --storage=ram
          
          ls -lh "${{ matrix.region.name }}.mbtiles"
          
          if [ ! -s "${{ matrix.region.name }}.mbtiles" ]; then
            echo "ERROR: mbtiles файл пустой или не создан"
            exit 1
          fi

      - name: Upload mbtiles to release
        run: |
          gh release upload maps "${{ matrix.region.name }}.mbtiles" --clobber
          echo "✅ Загружен: ${{ matrix.region.name }}.mbtiles"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cleanup
        run: |
          rm -f "${{ matrix.region.name }}.osm.pbf" \
                "${{ matrix.region.name }}.mbtiles"

  # === JOB 2: Графы GraphHopper (car + foot) ===
  generate-graphs:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline Maps (PMTiles)" --notes "pmtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache GraphHopper jar
        id: cache-gh
        uses: actions/cache@v4
        with:
          path: graphhopper-web.jar
          key: graphhopper-5.0-v1

      - name: Download GraphHopper (if not cached)
        if: steps.cache-gh.outputs.cache-hit != 'true'
        run: |
          curl -L -o graphhopper-web.jar \
            "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/5.0/graphhopper-web-5.0.jar"
          ls -lh graphhopper-web.jar

      - name: Install osmium
        run: sudo apt-get install -y osmium-tool

      - name: Cache Belarus PBF
        id: cache-belarus
        uses: actions/cache@v4
        with:
          path: belarus.osm.pbf
          key: belarus-pbf-v2
          restore-keys: |
            belarus-pbf-

      - name: Download Belarus PBF (with retry)
        if: steps.cache-belarus.outputs.cache-hit != 'true'
        run: |
          echo "=== Скачиваем Belarus PBF ==="
          
          MAX_ATTEMPTS=3
          ATTEMPT=0
          SUCCESS=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$SUCCESS" != "true" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Attempt $ATTEMPT of $MAX_ATTEMPTS ==="
            
            rm -f belarus.osm.pbf
            
            HTTP_CODE=$(curl -L \
              --connect-timeout 60 \
              --max-time 1800 \
              --retry 3 \
              --retry-delay 30 \
              --retry-all-errors \
              --progress-bar \
              -o belarus.osm.pbf \
              -w "%{http_code}" \
              "https://download.geofabrik.de/europe/belarus-latest.osm.pbf")
            
            echo "HTTP status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ HTTP $HTTP_CODE, retrying..."
              rm -f belarus.osm.pbf
              sleep 30
              continue
            fi
            
            if [ ! -f belarus.osm.pbf ]; then
              echo "❌ File not created"
              sleep 30
              continue
            fi
            
            FILE_SIZE=$(stat -c%s belarus.osm.pbf 2>/dev/null || echo "0")
            echo "Размер: $FILE_SIZE байт"
            
            if [ "$FILE_SIZE" -lt 1048576 ]; then
              echo "❌ File too small, probably HTML error page"
              head -c 500 belarus.osm.pbf
              rm -f belarus.osm.pbf
              sleep 30
              continue
            fi
            
            SUCCESS=true
            echo "✅ Download successful: $FILE_SIZE bytes"
          done
          
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Failed to download after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          
          ls -lh belarus.osm.pbf

      - name: Generate road graphs (car + foot)
        run: |
          regions=(
            "gomel_region|27.50,51.20,32.80,53.10"
            "minsk_region|26.30,52.80,29.20,55.00"
          )
          
          for r in "${regions[@]}"; do
            IFS='|' read -r name bbox <<< "$r"
            echo "::group::Generating graph for $name"
            
            osmium extract belarus.osm.pbf -b "$bbox" -o "${name}.osm.pbf" --overwrite
            
            cat > "${name}_config.yml" <<EOF
          graphhopper:
            datareader.file: ${name}.osm.pbf
            graph.location: ${name}.gh
            graph.encoded_values: surface,road_class,road_environment,max_speed
            profiles:
              - name: car
                vehicle: car
                weighting: fastest
                turn_costs: true
              - name: foot
                vehicle: foot
                weighting: shortest
                turn_costs: false
            prepare:
              min_network_size: 200
              ch:
                - profile: car
                - profile: foot
            routing:
              ch.disabling_allowed: true
              lm.disabling_allowed: true
            index:
              precise_elevation: false
          EOF
            
            java -Xmx4g -jar graphhopper-web.jar import "${name}_config.yml"
            
            zip -r "${name}_graph.zip" "${name}.gh"
            gh release upload maps "${name}_graph.zip" --clobber
            
            rm -rf "${name}.gh" "${name}_graph.zip" "${name}.osm.pbf" "${name}_config.yml"
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ github.token }}