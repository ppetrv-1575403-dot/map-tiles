name: Generate regions with Planetiler (OpenMapTiles)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-maps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region:
          - name: minsk_region
            bbox: "26.30,52.80,29.20,55.00"
            source_url: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
            source_name: "belarus"
            maxzoom: 15
          - name: gomel_region
            bbox: "27.50,51.20,32.80,53.10"
            source_url: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
            source_name: "belarus"
            maxzoom: 15
          - name: moscow_region
            bbox: "35.10,54.20,40.20,56.90"
            source_url: "https://download.geofabrik.de/europe/russia/central-fed-district-latest.osm.pbf"
            source_name: "russia-central"
            maxzoom: 15
          - name: leningrad_region
            bbox: "27.70,58.40,35.70,61.40"
            source_url: "https://download.geofabrik.de/europe/russia/northwestern-fed-district-latest.osm.pbf"
            source_name: "russia-nw"
            maxzoom: 15
          - name: spb
            bbox: "29.90,59.70,30.60,60.10"
            source_url: "https://download.geofabrik.de/europe/russia/northwestern-fed-district-latest.osm.pbf"
            source_name: "russia-nw"
            maxzoom: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline MBTiles" --notes "mbtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Planetiler
        run: |
          echo "=== Скачиваем последнюю версию Planetiler ==="
          curl -L -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar"
          ls -lh planetiler.jar
          java -version
          java -jar planetiler.jar --version 2>&1 | head -5 || true

      - name: Cache source OSM PBF
        id: cache-source
        uses: actions/cache@v4
        with:
          path: source.osm.pbf
          key: osm-pbf-${{ matrix.region.source_name }}-v1
          restore-keys: |
            osm-pbf-${{ matrix.region.source_name }}-

      - name: Download source OSM PBF (if not cached)
        if: steps.cache-source.outputs.cache-hit != 'true'
        run: |
          echo "=== Скачиваем ${{ matrix.region.source_name }} PBF ==="
          curl -L --connect-timeout 30 --max-time 1200 \
            --progress-bar \
            -o source.osm.pbf \
            "${{ matrix.region.source_url }}"
          ls -lh source.osm.pbf
          
          FILE_SIZE=$(stat -c%s source.osm.pbf 2>/dev/null || echo "0")
          echo "=== Скачано: $FILE_SIZE байт ==="
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: Файл слишком мал или не скачался"
            exit 1
          fi

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      - name: Extract region bbox
        run: |
          echo "=== Вырезаем ${{ matrix.region.name }} ==="
          echo "BBox: ${{ matrix.region.bbox }}"
          osmium extract source.osm.pbf \
            -b "${{ matrix.region.bbox }}" \
            -o "${{ matrix.region.name }}.osm.pbf" \
            --overwrite
          ls -lh "${{ matrix.region.name }}.osm.pbf"

      # === ИСПРАВЛЕННЫЙ ШАГ: добавлен --download ===
      - name: Generate pmtiles with Planetiler (OpenMapTiles profile)
        run: |
          echo "=== Генерируем pmtiles (OpenMapTiles, maxzoom=${{ matrix.region.maxzoom }}) ==="
          
          # --download — скачивает Natural Earth, lake_centerline и другие вспомогательные файлы
          java -Xmx6g -jar planetiler.jar \
            --osm-path="${{ matrix.region.name }}.osm.pbf" \
            --output="${{ matrix.region.name }}.pmtiles" \
            --bounds="${{ matrix.region.bbox }}" \
            --profile=openmaptiles \
            --maxzoom=${{ matrix.region.maxzoom }} \
            --force \
            --download \
            --storage=ram
          
          ls -lh "${{ matrix.region.name }}.pmtiles"
          
          if [ ! -s "${{ matrix.region.name }}.pmtiles" ]; then
            echo "ERROR: pmtiles файл пустой или не создан"
            exit 1
          fi

      - name: Download pmtiles CLI
        run: |
          ASSET_URL=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | grep "browser_download_url" | grep "Linux_x86_64.tar.gz" \
            | head -1 | sed 's/.*"browser_download_url": "\(.*\)".*/\1/')
          echo "Downloading: $ASSET_URL"
          curl -L -o pmtiles.tar.gz "$ASSET_URL"
          tar -xzf pmtiles.tar.gz
          chmod +x pmtiles

      - name: Convert pmtiles to mbtiles
        run: |
          echo "=== Конвертируем pmtiles → mbtiles ==="
          ./pmtiles convert "${{ matrix.region.name }}.pmtiles" "${{ matrix.region.name }}.mbtiles"
          ls -lh "${{ matrix.region.name }}.mbtiles"
          
          echo "=== Информация о mbtiles ==="
          ./pmtiles show "${{ matrix.region.name }}.mbtiles" | head -20 || true

      - name: Upload to release
        run: |
          gh release upload maps "${{ matrix.region.name }}.mbtiles" --clobber
          echo "✅ Загружен: ${{ matrix.region.name }}.mbtiles"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cleanup
        run: |
          rm -f "${{ matrix.region.name }}.osm.pbf" \
                "${{ matrix.region.name }}.pmtiles" \
                "${{ matrix.region.name }}.mbtiles"

  generate-graphs:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure release exists
        run: gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline MBTiles" --notes "mbtiles regions"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache GraphHopper jar
        id: cache-gh
        uses: actions/cache@v4
        with:
          path: graphhopper-web.jar
          key: graphhopper-5.0-v1

      - name: Download GraphHopper (if not cached)
        if: steps.cache-gh.outputs.cache-hit != 'true'
        run: |
          curl -L -o graphhopper-web.jar \
            "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/5.0/graphhopper-web-5.0.jar"
          ls -lh graphhopper-web.jar

      - name: Install osmium
        run: sudo apt-get install -y osmium-tool

      - name: Cache Belarus PBF
        id: cache-belarus
        uses: actions/cache@v4
        with:
          path: belarus.osm.pbf
          key: belarus-pbf-v1
          restore-keys: |
            belarus-pbf-

      - name: Download Belarus PBF (if not cached)
        if: steps.cache-belarus.outputs.cache-hit != 'true'
        run: |
          curl -L --connect-timeout 30 --max-time 600 \
            -o belarus.osm.pbf \
            "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
          ls -lh belarus.osm.pbf

      - name: Generate road graphs (car + foot)
        run: |
          regions=(
            "gomel_region|27.50,51.20,32.80,53.10"
            "minsk_region|26.30,52.80,29.20,55.00"
          )
          
          for r in "${regions[@]}"; do
            IFS='|' read -r name bbox <<< "$r"
            echo "::group::Generating graph for $name"
            
            osmium extract belarus.osm.pbf -b "$bbox" -o "${name}.osm.pbf" --overwrite
            
            cat > "${name}_config.yml" <<EOF
          graphhopper:
            datareader.file: ${name}.osm.pbf
            graph.location: ${name}.gh
            import.osm.ignored_highways: []
            graph.encoded_values: surface,road_class,road_environment,max_speed
            profiles:
              - name: car
                vehicle: car
                weighting: fastest
                turn_costs: true
              - name: foot
                vehicle: foot
                weighting: shortest
                turn_costs: false
            prepare:
              min_network_size: 200
              ch:
                weightings: fastest|turn_costs=true,shortest
            routing:
              ch.disabling_allowed: true
              lm.disabling_allowed: true
            index:
              precise_elevation: false
          EOF
            
            java -Xmx4g -jar graphhopper-web.jar import "${name}_config.yml"
            
            zip -r "${name}_graph.zip" "${name}.gh"
            gh release upload maps "${name}_graph.zip" --clobber
            
            rm -rf "${name}.gh" "${name}_graph.zip" "${name}.osm.pbf" "${name}_config.yml"
            echo "::endgroup::"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  summary:
    runs-on: ubuntu-latest
    needs: [generate-maps, generate-graphs]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "=== Сводка ==="
          echo "Planetiler + OpenMapTiles профиль"
          echo ""
          echo "Тайлы содержат:"
          echo "  ✅ Номера домов (слой housenumber)"
          echo "  ✅ Названия зданий"
          echo "  ✅ Тропинки (path, footway, pedestrian, track)"
          echo "  ✅ POI (магазины, кафе, остановки)"
          echo "  ✅ Парки, леса, водоёмы"
          echo ""
          echo "Графы: car (fastest) + foot (shortest)"